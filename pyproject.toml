[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-md-analyzer"
version = "1.0.0"
description = "GitHub CLAUDE.md file analyzer with embedding-based relationship visualization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Claude MD Analyzer"}
]
keywords = ["github", "claude", "markdown", "analyzer", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "requests>=2.31.0",
    "PyGithub>=2.1.1",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "umap-learn>=0.5.5",
]

[project.scripts]
claude-md = "claude_md_analyzer.cli:app"

[project.urls]
Homepage = "https://github.com/claudeMD/claude-md-analyzer"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_md_analyzer*"]
